<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>box-sizing ::before demo</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 40px;
        display: flex;
        gap: 40px;
      }

      /* ❌ Case 1: box-sizing NOT applied to pseudo-elements */
      .wrong * {
        box-sizing: border-box;
      }

      /* ✅ Case 2: box-sizing applied properly */
      .correct *,
      .correct *::before,
      .correct *::after {
        box-sizing: border-box;
      }

      .card {
        width: 200px;
        height: 120px;
        border: 3px solid black;
        position: relative;
        background: white;
      }

      .card::before {
        content: "hi hahaha";
        position: absolute;
        top: 10px;
        left: 10px;
        width: 100%;
        height: 100%;
        padding: 20px;
        border: 4px solid red;
        background: rgba(255, 0, 0, 0.2);
      }
      */ h3 {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrong">
      <h3>❌ Without ::before box-sizing</h3>
      <div class="card"></div>
    </div>

    <div class="correct">
      <h3>✅ With ::before box-sizing</h3>
      <div class="card"></div>
    </div>
  </body>
</html>
